version: '3.8'

services:
  validator:
    build: .
    container_name: amazon_listings_validator
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    container_name: validator_redis
    restart: unless-stopped
    ports:
      - "6379:6379"